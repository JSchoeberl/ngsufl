name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the release 6.2.2608 is too old, see docs/install.md
      - run: pip install --pre ngsolve
      - run: pip install fenics-ufl matplotlib scipy pytest pyadjoint-ad
      - run: pip install firedrake-fiat git+https://github.com/firedrakeproject/Irksome
      - run: pip install -e .
      # failing tests become annotations, readable without the log
      - name: pytest
        run: |
          set +e
          MPLBACKEND=Agg pytest -q -rf 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR)" pytest.log | head -20 | sed 's/^/::error::/'
          exit $status
