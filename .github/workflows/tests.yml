name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ngsolve fenics-ufl matplotlib scipy pytest
      - run: pip install -e .
      - run: MPLBACKEND=Agg pytest -q
